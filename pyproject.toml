[project]
name = "cortex9-geonode-layer-name-command-injection-model"
version = "0.1.0"
description = "Offline, inert model of the GeoNode ogr2ogr layer-name command injection fix (CVE-2026-33050)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
# SIM905, SIM110: derive_expected.py keeps a deliberately different style (independent derivation)
ignore = ["SIM905", "SIM110"]
